<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Hey GIG camera and searchable document workspace">
<title>Hey GIG · Glasses HUD</title>
<style>
/* Hallmark v2.0.0 | workspace | graphite and mint | live camera as product imagery */
/* Critique: give capture the primary canvas and keep review controls adjacent. */
:root {
  color-scheme: dark;
  --bg: #101815; --panel: #182521; --input: #0f1b17; --stage: #090f0d;
  --ink: #f0f9f2; --muted: #b0c6b9; --line: #3a5549; --accent: #c3ef8a;
  --on-accent: #152611; --paper: #fbfcfa; --print-ink: #121812;
  --body: "Instrument Sans", system-ui, sans-serif;
  --display: "Bricolage Grotesque", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
main { width: min(1250px, 92%); margin: 0 auto 40px; }
header, .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
header { padding: 24px 0; border-bottom: 1px solid var(--line); }
.brand { margin-right: auto; color: var(--accent); font-weight: 750; font-size: 21px; }
h1, h2 { font-family: var(--display); min-width: 0; overflow-wrap: break-word; text-wrap: balance; }
h1 { margin: 0; font-size: clamp(36px, 5vw, 70px); line-height: 1; letter-spacing: -.05em; }
h2 { margin: 0 0 12px; font-size: 23px; }
.intro { margin: 32px 0 20px; }
p { color: var(--muted); margin-block: 8px; }
label { font-size: 14px; color: var(--muted); }
input, button { font: inherit; border: 1px solid var(--line); border-radius: 7px; padding: 8px 12px; }
input { border-color: var(--muted); background: var(--input); color: var(--ink); max-width: 100%; }
button { background: var(--panel); color: var(--ink); cursor: pointer; }
#connect, #export { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
button:not(:disabled):hover { filter: brightness(1.14); }
button:not(:disabled):active { filter: brightness(.9); }
button:disabled, #connect:disabled, #export:disabled { background: var(--stage); color: var(--muted); border-color: var(--line); cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.scan-layout { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.views { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.lens { position: relative; display: grid; place-items: center; margin: 0; border: 1px solid var(--line); border-radius: 18px; overflow: clip; background: var(--stage); aspect-ratio: 4 / 3; }
.lens img { position: absolute; width: 100%; height: 100%; object-fit: contain; z-index: 1; }
.lens img:not([src]) { visibility: hidden; }
.lens figcaption { z-index: 2; position: absolute; bottom: 0; width: 100%; padding: 12px 16px; background: var(--input); display: flex; justify-content: space-between; }
.lens figcaption span, .camera-placeholder { color: var(--muted); }
.lens[data-secondary]:not(.has-frame) { display: none; }
.scan-review { border-top: 2px solid var(--accent); padding: 16px 0; }
#pages { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0; gap: 12px; list-style: none; }
#pages li { border: 1px solid var(--line); border-radius: 9px; padding: 8px; }
#pages img { display: block; width: 100%; border-radius: 4px; margin: 0 0 8px; }
#pages button, .workspace li button { font-size: 14px; margin: 4px 4px 0 0; }
.workspace { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 28px; }
.workspace section { border-top: 1px solid var(--line); padding-top: 16px; }
.workspace ul { padding-left: 20px; overflow-wrap: anywhere; }
.workspace li { margin-bottom: 12px; }
@media (max-width: 760px) {
  .scan-layout, .workspace { grid-template-columns: minmax(0, 1fr); }
  header { align-items: flex-start; }
  header label { flex-basis: 100%; }
}
@media print {
  body { background: var(--paper); color: var(--print-ink); }
  main { margin: 0; width: 100%; }
  header, .intro, .views, .controls, .workspace, #workspace-status, #status, #export-status, h2, button { display: none !important; }
  .scan-layout, #pages { display: block; }
  #pages li { break-after: page; }
  #pages li:last-child { break-after: auto; }
  #pages img { width: 100%; max-height: 235mm; object-fit: contain; }
}
</style>
<main>
<header>
  <span class="brand">Hey GIG</span>
  <label>Access token <input id="token" type="password" autocomplete="off"></label>
  <button id="connect">Connect</button>
  <button id="stop" disabled>Stop preview</button>
</header>
<div class="intro"><h1>Document scanner</h1><p>Capture pages and export one searchable PDF.</p></div>
<p id="status" role="status">Preview disconnected</p>
<div class="scan-layout">
<div class="views">
  <figure class="lens"><span class="camera-placeholder">Waiting for the USB camera</span><img data-src="/frame/reading" id="reading" alt="Reading camera"><figcaption>Reading camera <span id="reading-state">Offline</span></figcaption></figure>
  <figure class="lens" data-secondary><img data-src="/frame/scene" id="scene" alt="Scene camera"><figcaption>Scene camera <span id="scene-state">Offline</span></figcaption></figure>
</div>
<section class="scan-review" aria-labelledby="review-title">
<h2 id="review-title">Pages <span id="page-count">0</span></h2>
<div class="controls">
  <button id="capture" disabled>Add page</button>
  <label><input id="auto-capture" type="checkbox"> Auto-capture</label>
  <button id="extract" disabled>Extract text</button>
  <button id="export" disabled>Save searchable PDF</button>
</div>
<p id="capture-status" role="status"></p>
<p id="export-status" role="status"></p>
<ol id="pages" aria-label="Captured document pages"></ol>
<details id="extraction" hidden>
  <summary>Recognized text</summary>
  <button id="save-extraction">Save extraction JSON</button>
  <div id="extraction-pages"></div>
</details>
</section>
</div>
<p id="workspace-status" role="status"></p>
<div class="workspace">
  <section><h2>Library</h2><ul id="library"></ul></section>
  <section><h2>Approvals</h2><ul id="approvals"></ul></section>
  <section><h2>Activity</h2><ul id="activity"></ul></section>
</div>
</main>
<script>
const byId = id => document.getElementById(id);
const cameras = ['scene', 'reading'];
const live = new Map();
const pages = new Map();
const pageLimit = 20;
let session;
let exporting = false;
let extracting = false;
let extractedPages = [];
let lastInspection = 0;
let stableCount = 0;
let previousCorners;
const capturedSignatures = [];

function clear(camera, message) {
  if (live.has(camera)) URL.revokeObjectURL(live.get(camera).url);
  live.delete(camera);
  byId(camera).removeAttribute('src');
  byId(camera).closest('.lens').classList.remove('has-frame');
  byId(camera + '-state').textContent = message;
  if (camera === 'reading') {
    stableCount = 0;
    previousCorners = undefined;
    updateScanActions();
  }
}

async function update(camera, signal, headers) {
  try {
    const response = await fetch(byId(camera).dataset.src, { signal, headers, cache: 'no-store' });
    if (!response.ok) {
      const message = {401: 'Invalid access token', 404: 'Waiting for frames'}[response.status];
      throw new Error(message || 'Camera request failed');
    }
    const blob = await response.blob();
    if (signal.aborted) return;
    if (live.has(camera)) URL.revokeObjectURL(live.get(camera).url);
    const url = URL.createObjectURL(blob);
    live.set(camera, { blob, url });
    byId(camera).src = url;
    byId(camera).closest('.lens').classList.add('has-frame');
    byId(camera + '-state').textContent = 'Live';
    if (camera === 'reading') {
      updateScanActions();
      await autoCapture(blob, signal, headers);
    }
  } catch (error) {
    if (!signal.aborted) clear(camera, error.message);
  }
}

async function connect() {
  if (session) return;
  const token = byId('token').value.trim();
  if (!token) {
    byId('status').textContent = 'Enter the access token from Mac Terminal.';
    byId('token').focus();
    return;
  }
  session = new AbortController();
  const signal = session.signal;
  const headers = { Authorization: 'Bearer ' + token };
  byId('connect').disabled = byId('token').disabled = true;
  byId('stop').disabled = false;
  byId('status').textContent = 'Preview open';
  refreshWorkspace();
  while (!signal.aborted) {
    await Promise.all(cameras.map(camera => update(camera, signal, headers)));
    await new Promise(resolve => setTimeout(resolve, 200));
  }
}

function stop() {
  session?.abort();
  session = undefined;
  cameras.forEach(camera => clear(camera, 'Offline'));
  byId('connect').disabled = byId('token').disabled = false;
  byId('stop').disabled = true;
  byId('status').textContent = 'Preview stopped. Stop capture in Mac Terminal.';
}

function updateScanActions() {
  byId('page-count').textContent = pages.size;
  byId('capture').disabled = !live.has('reading') || pages.size >= pageLimit;
  byId('export').disabled = exporting || pages.size === 0;
  byId('extract').disabled = extracting || pages.size === 0;
}
async function autoCapture(blob, signal, headers) {
  if (!byId('auto-capture').checked || pages.size >= pageLimit) return;
  if (performance.now() - lastInspection < 550) return;
  lastInspection = performance.now();
  const status = byId('capture-status');
  try {
    const response = await fetch('/scan/inspect', { method: 'POST', body: blob, signal, headers });
    if (!response.ok) throw new Error(await response.text());
    const page = await response.json();
    if (signal.aborted || !byId('auto-capture').checked) return;
    if (!page.corners) {
      stableCount = 0;
      previousCorners = undefined;
      status.textContent = page.status;
      return;
    }
    const stable = previousCorners && page.corners.every(([x, y], i) =>
      Math.hypot(x - previousCorners[i][0], y - previousCorners[i][1]) <= 10);
    previousCorners = page.corners;
    stableCount = stable ? stableCount + 1 : 1;
    if (stableCount < 3) {
      status.textContent = 'Hold the page steady.';
      return;
    }
    const duplicate = capturedSignatures.some(signature => {
      let difference = 0;
      for (let i = 0; i < signature.length; i++) {
        if (signature[i] !== page.signature[i]) difference++;
      }
      return difference <= 18;
    });
    if (duplicate) {
      status.textContent = 'Page already captured. Turn to the next page or use Add page.';
      return;
    }
    const bytes = Uint8Array.from(atob(page.jpeg), character => character.charCodeAt(0));
    addPage(new Blob([bytes], { type: 'image/jpeg' }), page.signature);
    stableCount = 0;
    status.textContent = 'Page captured and straightened.';
  } catch (error) {
    if (!signal.aborted) {
      byId('auto-capture').checked = false;
      status.textContent = error.message || 'Automatic capture stopped. Use Add page to capture manually.';
    }
  }
}

function addPage(blob = live.get('reading')?.blob, signature) {
  if (!blob || pages.size >= pageLimit) return;
  const url = URL.createObjectURL(blob);
  if (signature) capturedSignatures.push(signature);
  const row = document.createElement('li');
  const image = new Image();
  image.alt = 'Captured document page';
  image.src = url;
  const remove = document.createElement('button');
  remove.textContent = 'Remove page';
  remove.onclick = () => {
    row.remove();
    URL.revokeObjectURL(url);
    pages.delete(row);
    if (signature) capturedSignatures.splice(capturedSignatures.indexOf(signature), 1);
    updateScanActions();
  };
  const earlier = document.createElement('button');
  earlier.textContent = 'Move up';
  earlier.onclick = () => {
    const previous = row.previousElementSibling;
    if (previous) row.parentElement.insertBefore(row, previous);
  };
  row.append(image, remove, earlier);
  byId('pages').append(row);
  pages.set(row, blob);
  updateScanActions();
  byId('export-status').textContent = pages.size === pageLimit ? '20-page limit reached.' : '';
}

async function exportPdf() {
  if (exporting || !pages.size) return;
  exporting = true;
  updateScanActions();
  const status = byId('export-status');
  status.textContent = 'Recognizing text…';
  const parts = [];
  for (const row of byId('pages').children) {
    const page = pages.get(row);
    const header = new DataView(new ArrayBuffer(4));
    header.setUint32(0, page.size);
    parts.push(header.buffer, page);
  }
  try {
    const response = await fetch('/scan/pdf', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + byId('token').value.trim() },
      body: new Blob(parts, { type: 'application/octet-stream' })
    });
    if (!response.ok) {
      throw new Error(response.status === 401 ? 'Enter the access token for this session.' : await response.text());
    }
    downloadFile(await response.blob(), 'hey-gig-searchable.pdf');
    status.textContent = 'Searchable PDF ready. Check your browser downloads.';
    refreshWorkspace();
  } catch (error) {
    status.textContent = error.message || 'PDF export failed.';
  } finally {
    exporting = false;
    updateScanActions();
  }
}

function downloadFile(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function workspaceRequest(path, data) {
  const headers = { Authorization: 'Bearer ' + byId('token').value.trim() };
  const options = { headers, cache: 'no-store' };
  if (data) {
    headers['Content-Type'] = 'application/json';
    options.method = 'POST';
    options.body = JSON.stringify(data);
  }
  const response = await fetch(path, options);
  if (!response.ok) throw new Error((await response.text()) || 'Workspace request failed.');
  return response;
}

function action(label, run) {
  const button = document.createElement('button');
  button.textContent = label;
  button.onclick = async () => {
    button.disabled = true;
    byId('workspace-status').textContent = '';
    try { await run(); }
    catch (error) { byId('workspace-status').textContent = error.message; }
    finally { button.disabled = false; }
  };
  return button;
}

function renderList(id, entries, render, empty) {
  const list = byId(id);
  list.replaceChildren();
  for (const entry of entries) {
    const row = document.createElement('li');
    render(row, entry);
    list.append(row);
  }
  if (!entries.length) {
    const row = document.createElement('li');
    row.textContent = empty;
    list.append(row);
  }
}

async function refreshWorkspace() {
  try {
    const response = await workspaceRequest('/workspace');
    const state = await response.json();
    renderList('library', state.documents, (row, doc) => {
      row.textContent = `Scan ${doc.id} · ${doc.pages} page${doc.pages === 1 ? '' : 's'}`;
      row.append(action('Download', async () => {
        const pdf = await workspaceRequest('/library/' + doc.id);
        downloadFile(await pdf.blob(), `hey-gig-${doc.id}.pdf`);
      }), action('Draft share', async () => {
        const recipient = window.prompt('Recipient for this share draft');
        if (!recipient?.trim()) return;
        await workspaceRequest('/approvals', { document: doc.id, recipient });
        await refreshWorkspace();
      }));
    }, 'Export a scan to add it to the library.');

    renderList('approvals', state.approvals, (row, approval) => {
      const states = { pending: 'Awaiting approval', approved: 'Approved · delivery pending', denied: 'Denied' };
      row.textContent = `Scan ${approval.document_id} → ${approval.recipient} · ${states[approval.state]}`;
      if (approval.state === 'pending') {
        for (const [label, decision] of [['Approve', 'approved'], ['Deny', 'denied']]) {
          row.append(action(label, async () => {
            await workspaceRequest('/approvals/decision', { id: approval.id, decision });
            await refreshWorkspace();
          }));
        }
      }
    }, 'No share drafts yet.');

    renderList('activity', state.activity, (row, entry) => {
      row.textContent = `${entry.created} UTC · ${entry.message}`;
    }, 'No activity yet.');
    byId('workspace-status').textContent = '';
  } catch (error) {
    byId('workspace-status').textContent = error.message;
  }
}

byId('connect').onclick = connect;
byId('stop').onclick = stop;
byId('capture').onclick = () => addPage();
byId('auto-capture').onchange = () => {
  stableCount = 0;
  previousCorners = undefined;
  byId('capture-status').textContent = byId('auto-capture').checked ? 'Fit all four corners in view.' : '';
};
byId('extract').onclick = async () => {
  if (extracting) return;
  extracting = true;
  updateScanActions();
  const status = byId('export-status');
  const input = Array.from(byId('pages').children, row => pages.get(row));
  const output = [];
  try {
    for (const [index, blob] of input.entries()) {
      status.textContent = `Extracting page ${index + 1} of ${input.length}…`;
      const response = await fetch('/scan/extract', { method: 'POST', body: blob,
        headers: { Authorization: 'Bearer ' + byId('token').value.trim() } });
      if (!response.ok) throw new Error((await response.text()) || 'Extraction failed.');
      output.push({ page: index + 1, ...await response.json() });
    }
    extractedPages = output;
    const panel = byId('extraction');
    const content = byId('extraction-pages');
    content.replaceChildren();
    for (const page of output) {
      const heading = document.createElement('h3');
      heading.textContent = `Page ${page.page}`;
      const text = document.createElement('p');
      text.style.whiteSpace = 'pre-wrap';
      text.textContent = page.lines.map(line => line.text).join('\n') || 'No readable text found.';
      content.append(heading, text);
    }
    panel.hidden = false;
    panel.open = true;
    const words = output.flatMap(page => page.lines.flatMap(line => line.words));
    const uncertain = words.filter(word => word.confidence < 0.65).length;
    status.textContent = !words.length ? 'No readable text. Try a closer capture.'
      : uncertain > words.length * 0.15 ? 'Review the text against the image. Several words had low OCR confidence.'
      : 'Extraction complete.';
  } catch (error) {
    status.textContent = error.message;
  } finally {
    extracting = false;
    updateScanActions();
  }
};
byId('save-extraction').onclick = () => downloadFile(
  new Blob([JSON.stringify({ pages: extractedPages }, null, 2)], { type: 'application/json' }),
  'hey-gig-extraction.json'
);
byId('export').onclick = exportPdf;
byId('token').addEventListener('keydown', event => {
  if (event.key === 'Enter') connect();
});
</script>
</html>
